<svg viewBox="0 0 220 170" width="440" height="340" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Cosmo the janitor celebrating: broom raised, all clean -->
  <rect width="220" height="170" fill="#131127"/>
  <!-- confetti -->
  <rect x="36" y="20" width="6" height="6" fill="#ffd166"/>
  <rect x="170" y="16" width="6" height="6" fill="#7de8c3"/>
  <rect x="24" y="70" width="5" height="5" fill="#ff9eae"/>
  <rect x="192" y="60" width="5" height="5" fill="#7de8c3"/>
  <rect x="60" y="10" width="5" height="5" fill="#ff9eae"/>
  <rect x="140" y="26" width="5" height="5" fill="#ffd166"/>
  <!-- broom raised overhead in the right hand: solid brush head + handle -->
  <rect x="156" y="10" width="26" height="2" fill="#e0b84d"/>
  <rect x="156" y="12" width="26" height="9" fill="#ffd166"/>
  <rect x="166" y="21" width="6" height="29" fill="#ffd166"/>
  <!-- body upright (warm lavender) -->
  <rect x="70" y="50" width="80" height="12" fill="#c5a8dd"/>
  <rect x="60" y="62" width="100" height="56" fill="#c5a8dd"/>
  <rect x="70" y="118" width="80" height="12" fill="#a386c2"/>
  <!-- helmet -->
  <rect x="60" y="58" width="100" height="4" fill="#dff3ff" opacity=".8"/>
  <rect x="56" y="62" width="4" height="34" fill="#dff3ff" opacity=".8"/>
  <rect x="160" y="62" width="4" height="34" fill="#dff3ff" opacity=".8"/>
  <!-- happy closed eyes -->
  <rect x="84" y="74" width="6" height="6" fill="#241d3d"/>
  <rect x="90" y="70" width="6" height="6" fill="#241d3d"/>
  <rect x="96" y="74" width="6" height="6" fill="#241d3d"/>
  <rect x="120" y="74" width="6" height="6" fill="#241d3d"/>
  <rect x="126" y="70" width="6" height="6" fill="#241d3d"/>
  <rect x="132" y="74" width="6" height="6" fill="#241d3d"/>
  <!-- open happy mouth -->
  <rect x="102" y="92" width="18" height="10" fill="#241d3d"/>
  <rect x="106" y="98" width="10" height="4" fill="#ff9eae"/>
  <!-- arms raised -->
  <rect x="44" y="46" width="16" height="14" fill="#a386c2"/>
  <rect x="160" y="46" width="16" height="14" fill="#a386c2"/>
  <!-- legs -->
  <rect x="78" y="130" width="16" height="16" fill="#a386c2"/>
  <rect x="126" y="130" width="16" height="16" fill="#a386c2"/>
</svg>
